[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yomikata-plus"
version = "0.0.4"
authors = [{name="Sam Passaglia"}]
description = "Japanese kanji disambiguation"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License"
]
dynamic = ["dependencies"]

[project.urls]
"Homepage" = "https://github.com/passaglia/yomikata"
"Demo" = "https://huggingface.co/spaces/passaglia/yomikata"
"Bug Tracker" = "https://github.com/passaglia/yomikata/issues"

[tool.setuptools.dynamic]
dependencies = {file = ["./requirements/requirements-inference.txt","./requirements/requirements-dev.txt","./requirements/requirements-app.txt"]}

[tool.setuptools]
packages = ["yomikata", "yomikata.config", "yomikata.download"]

[tool.flake8]
exclude = "venv"
ignore = ["E203","E501", "W503", "E226"]
max-line-length = 79
# E501: Line too long
# W503: Line break occurred before binary operator
# E226: Missing white space around arithmetic operator
# E203: whitespace before ':' ()

# iSort
[tool.isort]
profile = "black"
line_length = 79
multi_line_output = 3
include_trailing_comma = true
virtual_env = "venv"

# Black formatting
[tool.black]
line-length = 100
include = '\.pyi?$'
exclude = '''
    /(
      .eggs         # exclude a few common directories
    | .git          # in the root of the project
    | .hg
    | .mypy_cache
    | .tox
    | venv
    | _build
    | buck-out
    | build
    | dist
  )/
  '''

# Semantic Release
[tool.semantic_release]
version_variables = [
    "yomikata/__init__.py:__version__",
    "pyproject.toml:version"
]
version_toml = [
    "pyproject.toml:project.version"
]
version_pattern = [
    "yomikata/__init__.py:__version__ = \"{version}\""
]
upload_to_pypi = false
upload_to_release = true
build_command = "python -m build"
commit_message = "chore(release): {version} [skip ci]"
commit_parser = "angular"
logging_use_named_masks = false
major_on_zero = false
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog]
template_dir = "templates"
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = [
    "chore*",
    "ci*",
    "Merge pull request*"
]

[tool.semantic_release.changelog.environment]
keep_trailing_newline = true

[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "build",
    "chore",
    "ci",
    "docs",
    "feat",
    "fix",
    "perf",
    "style",
    "refactor",
    "test"
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]