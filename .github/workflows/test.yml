name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mecab libmecab-dev mecab-ipadic-utf8
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install PyTorch first (CPU version for CI)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Install package with all dependencies
          pip install --pre .
          pip install pytest pytest-cov pytest-mock
          pip install --pre -r requirements/requirements-dev.txt -r requirements/requirements-inference.txt
      
      - name: Check imports
        run: |
          python -c "import yomikata; print('yomikata imported')" || echo "Failed to import yomikata"
          python -c "from yomikata import utils; print('utils imported')" || echo "Failed to import utils"
          pip list
      
      - name: Run tests with coverage
        run: |
          python -m pytest tests/test_basic.py tests/test_utils.py tests/test_dbert.py tests/test_dictionary.py tests/test_integration.py -v --cov=yomikata --cov-report=xml --cov-report=term
      
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false